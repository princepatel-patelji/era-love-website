<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} & {{ partner }}'s Love ❤️</title>
    
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            /* Ekdam mast romantic background image aur dark gradient overlay */
            background: linear-gradient(rgba(15, 5, 20, 0.7), rgba(15, 5, 20, 0.7)), 
                        url('https://images.unsplash.com/photo-1518599904199-0ca897819ddb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Glassmorphism Container */
        .container {
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            margin: 40px auto;
            width: 90%;
            max-width: 850px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 105, 180, 0.2);
            position: relative;
            z-index: 10;
            animation: floatContainer 6s ease-in-out infinite;
        }

        @keyframes floatContainer {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5em;
            color: #ffb6c1;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
            margin-bottom: 20px;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .love-messages {
            margin: 20px 0 40px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .love-messages p {
            font-size: 1.15em;
            font-weight: 300;
            margin: 12px 0;
            color: #ffe4e1;
            line-height: 1.6;
            animation: slideUp 1s ease-out forwards;
            opacity: 0;
        }

        /* Jinja Message Animation Delay */
        .love-messages p:nth-child(1) { animation-delay: 0.3s; }
        .love-messages p:nth-child(2) { animation-delay: 0.6s; }
        .love-messages p:nth-child(3) { animation-delay: 0.9s; }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Beautiful Navigation Buttons */
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 400;
            padding: 10px 22px;
            border-radius: 30px;
            background: rgba(255, 105, 180, 0.15);
            border: 1px solid rgba(255, 105, 180, 0.4);
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .nav-links a:hover {
            background: #ff477e;
            box-shadow: 0 0 15px #ff477e;
            transform: translateY(-3px) scale(1.05);
            color: #fff;
        }

        /* Real CSS Hearts (Not just squares) */
        .heart {
            position: fixed;
            width: 24px;
            height: 24px;
            background: #ff477e;
            transform: rotate(-45deg);
            animation: floatUp 6s ease-in infinite, heartbeat 1.5s infinite;
            z-index: 1;
            opacity: 0.6;
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ff477e;
            border-radius: 50%;
        }
        
        .heart::before { top: -12px; left: 0; }
        .heart::after { top: 0; left: 12px; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(-45deg) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-20vh) rotate(-45deg) scale(1.2); opacity: 0; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.15) rotate(-45deg); }
        }

        /* Floating Sparkles */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #fff, 0 0 20px 2px #ffb6c1;
            animation: twinkle 3s infinite alternate;
            z-index: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1.5); }
        }

        /* Elegant Footer Text */
        .love-text {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .love-text .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8em;
            color: #ff8da1;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }

        .love-text .subtitle {
            font-size: 1em;
            font-weight: 300;
            color: #ffd1dc;
            letter-spacing: 2px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .container { padding: 30px 20px; margin: 20px; width: 95%; }
            h1 { font-size: 2.5em; }
            .nav-links { gap: 10px; }
            .nav-links a { padding: 8px 16px; font-size: 0.85em; }
            .love-text .title { font-size: 2.2em; }
        }
    </style>
</head>
<body>
    
    <!-- Background Animated Hearts -->
    <div class="heart" style="left: 10%; animation-delay: 0s;"></div>
    <div class="heart" style="left: 30%; animation-delay: 2s; width: 16px; height: 16px;"></div>
    <div class="heart" style="left: 50%; animation-delay: 4s;"></div>
    <div class="heart" style="left: 70%; animation-delay: 1.5s; width: 20px; height: 20px;"></div>
    <div class="heart" style="left: 90%; animation-delay: 3s;"></div>

    <!-- Background Sparkles -->
    <div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0.5s;"></div>
    <div class="sparkle" style="top: 25%; left: 80%; animation-delay: 1.2s;"></div>
    <div class="sparkle" style="top: 60%; left: 15%; animation-delay: 0.8s;"></div>
    <div class="sparkle" style="top: 75%; left: 85%; animation-delay: 2.5s;"></div>
    <div class="sparkle" style="top: 40%; left: 50%; animation-delay: 1.8s;"></div>

    <div class="container">
        <!-- Jinja Title -->
        <h1>{{ name }} & {{ partner }}'s Love Story <span style="font-size: 0.6em; color: #fff;">{{ year }}</span></h1>
        
        <!-- Jinja Messages Loop -->
        <div class="love-messages">
            {% for message in love_messages %}
                <p>✨ {{ message }}</p>
            {% endfor %}
        </div>
        
        <!-- Beautiful Nav Buttons -->
        <div class="nav-links">
            <a href="/timeline">Timeline</a>
            <a href="/gallery">Gallery</a>
            <a href="/letter">Love Letter</a>
            <a href="/confession">Confession</a>
            <a href="/music">Music</a>
            <a href="/love">Love</a>
            <a href="/our_story">Our Story</a>
            <a href="/romance">Romance</a>
            <a href="/love_card">Love Card</a>
            <a href="/happy_birthday">Happy Birthday</a>
            <a href="/happy_happy_birthday">Happy Happy Birthday</a>
            <a href="/happy_birthday_2027">Happy Birthday 2027</a>
        </div>

        <!-- Extra Touch Elements inside Container for better visibility -->
        <div class="love-text">
            <div class="title">My Wife</div>
            <div class="subtitle">Era, My Forever Love ❤️</div>
        </div>
    </div>

</body>
</html>
