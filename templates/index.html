<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ name }} & {{ partner }}'s Love ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
        }
        .container {
            padding: 30px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            margin: 40px auto;
            max-width: 800px;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
        }
        h1 {
            font-size: 2.5em;
            color: #ff69b4;
            text-shadow: 2px 2px 4px #000;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .love-messages p {
            font-size: 1.1em;
            margin: 10px 0;
            color: #ffd1dc;
            animation: slideUp 1s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        a {
            color: #ff69b4;
            text-decoration: none;
            margin: 0 10px;
        }
        a:hover {
            color: #fff;
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .container { padding: 15px; margin: 20px; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ name }} & {{ partner }}'s Love Story - {{ year }}</h1>
        <div class="love-messages">
            {% for message in love_messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
        <p>Explore our journey: <a href="/timeline">Timeline</a> | <a href="/gallery">Gallery</a> | <a href="/letter">Love Letter</a> | <a href="/confession">Confession</a> | <a href="/music">Music</a> | <a href="/our_story">Our Story</a></p>
    </div>
</body>
</html>
<div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; pointer-events: none;">
    <div style="font-family: 'Parisienne', cursive; font-size: 4em; color: #ff69b4; text-shadow: 3px 3px 6px #ff1493, -3px -3px 6px #ffb6c1; animation: pulse 2s infinite;">
        My Wife
    </div>
    <div style="font-family: 'Arial', sans-serif; font-size: 1.5em; color: #ff69b4; text-shadow: 2px 2px 4px #ff1493; animation: float 3s infinite;">
        Era, My Forever Love ❤️
    </div>
</div>
<style>
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
    }
    @media (max-width: 600px) {
        div[style*="font-size: 4em"] { font-size: 2.5em; }
        div[style*="font-size: 1.5em"] { font-size: 1em; }
    }
</style>
