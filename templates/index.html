<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ name }} & {{ partner }}'s Love ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        .container {
            padding: 30px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            margin: 60px auto 120px; /* Increased bottom margin to accommodate text */
            max-width: 800px;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
            position: relative;
            z-index: 1;
        }
        h1 {
            font-size: 2.5em;
            color: #ff69b4;
            text-shadow: 2px 2px 4px #000;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .love-messages p {
            font-size: 1.1em;
            margin: 10px 0;
            color: #ffd1dc;
            animation: slideUp 1s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        a {
            color: #ff69b4;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.3s;
        }
        a:hover {
            color: #fff;
            text-decoration: underline;
        }
        /* Extra Touch Animations */
        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff69b4;
            transform: rotate(-45deg);
            animation: beat 1s infinite, float 3s infinite;
            z-index: 0;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1) rotate(-45deg); }
            50% { transform: scale(1.2) rotate(-45deg); }
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(-45deg); }
            50% { transform: translateY(-20px) rotate(-45deg); }
            100% { transform: translateY(0) rotate(-45deg); }
        }
        .love-text {
            position: fixed;
            bottom: 20px; /* Moved to bottom */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }
        .love-text .title {
            font-family: 'Parisienne', cursive;
            font-size: 3em;
            color: #ff69b4;
            text-shadow: 3px 3px 6px #ff1493, -3px -3px 6px #ffb6c1;
            animation: pulse 2s infinite;
        }
        .love-text .subtitle {
            font-family: 'Arial', sans-serif;
            font-size: 1.3em;
            color: #ff1493;
            text-shadow: 2px 2px 4px #ff69b4;
            animation: float 3s infinite;
            margin-top: 5px;
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 2s infinite;
            z-index: 0;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0; }
        }
        @media (max-width: 600px) {
            .container { padding: 15px; margin: 20px auto 100px; }
            h1 { font-size: 1.8em; }
            .love-text .title { font-size: 2em; }
            .love-text .subtitle { font-size: 1em; }
            .heart { width: 20px; height: 20px; }
            .sparkle { width: 6px; height: 6px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ name }} & {{ partner }}'s Love Story - {{ year }}</h1>
        <div class="love-messages">
            {% for message in love_messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
        <p>Explore our journey: <a href="/timeline">Timeline</a> | <a href="/gallery">Gallery</a> | <a href="/letter">Love Letter</a> | <a href="/confession">Confession</a> | <a href="/music">Music</a> | <a href="/love">Our Story</a></p>
    </div>

    <!-- Extra Touch Elements -->
    <div class="love-text">
        <div class="title">My Wife</div>
        <div class="subtitle">Era, My Forever Love ❤️</div>
    </div>

    <!-- Beating Hearts -->
    <div class="heart" style="top: 20%; left: 20%;"></div>
    <div class="heart" style="top: 40%; left: 40%;"></div>
    <div class="heart" style="top: 60%; left: 60%;"></div>
    <div class="heart" style="top: 30%; left: 70%;"></div>
    <div class="heart" style="top: 50%; left: 30%;"></div> <!-- Added one more -->

    <!-- Sparkling Effects -->
    <div class="sparkle" style="top: 10%; left: 15%;"></div>
    <div class="sparkle" style="top: 25%; left: 35%;"></div>
    <div class="sparkle" style="top: 50%; left: 55%;"></div>
    <div class="sparkle" style="top: 70%; left: 75%;"></div>
    <div class="sparkle" style="top: 15%; left: 60%;"></div> <!-- Added one more -->
</body>
</html>
