<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confessions - Prince & Era</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa, #ffb6c1); }
        .navbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .parisienne { font-family: 'Parisienne', cursive; }
        .confession-card {
            background: white;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar fixed top-0 w-full z-50 shadow-lg">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-pink-600 parisienne">Prince & Era</a>
            <div class="space-x-6">
                <a href="/timeline" class="text-pink-600 hover:text-pink-800">Our Story</a>
                <a href="/gallery" class="text-pink-600 hover:text-pink-800">Memories</a>
                <a href="/letter" class="text-pink-600 hover:text-pink-800">Love Letter</a>
                <a href="/confession" class="text-pink-600 hover:text-pink-800">Confessions</a>
                <a href="/music" class="text-pink-600 hover:text-pink-800">Music</a>
            </div>
        </div>
    </nav>

    <section class="py-20 mt-20">
        <div class="container mx-auto px-6">
            <h2 class="text-4xl text-center parisienne text-pink-600 mb-10">Whispers of Our Hearts</h2>
            <div class="card mb-10">
                <h3 class="text-2xl text-pink-600 mb-4">Share Your Feelings</h3>
                <div>
                    <textarea id="confessionInput" rows="4" class="w-full p-3 border rounded-lg" placeholder="Write your heart out, my love..."></textarea>
                    <button id="submitConfession" class="bg-pink-600 text-white px-6 py-2 rounded-full mt-4 hover:bg-pink-700">Send</button>
                </div>
            </div>
            <div id="confessions">
                {% for confession in confessions %}
                <div class="confession-card">
                    <p class="text-gray-700">{{ confession.message }}</p>
                    <p class="text-gray-500 text-sm mt-2">{{ confession.date }}</p>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>

    <footer class="bg-pink-600 text-white py-10">
        <div class="container mx-auto px-6 text-center">
            <p class="parisienne text-2xl">Made with ❤️ for Era by Prince</p>
        </div>
    </footer>

    <script>
        document.getElementById('submitConfession').addEventListener('click', () => {
            const message = document.getElementById('confessionInput').value;
            if (message.trim()) {
                fetch('/confession', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `message=${encodeURIComponent(message)}`
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const confessionsDiv = document.getElementById('confessions');
                        const newConfession = document.createElement('div');
                        newConfession.classList.add('confession-card');
                        newConfession.innerHTML = `
                            <p class="text-gray-700">${message}</p>
                            <p class="text-gray-500 text-sm mt-2">${new Date().toLocaleString()}</p>
                        `;
                        confessionsDiv.prepend(newConfession);
                        document.getElementById('confessionInput').value = '';
                    }
                });
            }
        });
    </script>
</body>
</html>
