<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories - Prince & Era ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffe4e1, #ff69b4);
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }
        .navbar {
            background: rgba(255, 105, 180, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            box-shadow: 0 2px 10px rgba(255, 105, 180, 0.5);
        }
        .parisienne { font-family: 'Parisienne', cursive; }
        .container { padding-top: 80px; padding-bottom: 20px; }
        h2 {
            font-size: 3em;
            color: #ff1493;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 0 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            background: rgba(255, 182, 193, 0.8);
            border-radius: 15px;
            padding: 10px;
            transition: transform 0.5s, box-shadow 0.5s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.7);
        }
        .gallery-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .caption {
            font-size: 1.1em;
            color: #ff1493;
            margin-top: 10px;
            font-weight: bold;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1em;
            transition: color 0.3s;
        }
        .navbar a:hover {
            color: #ff69b4;
        }
        footer {
            background: #ff69b4;
            padding: 15px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        footer p { font-size: 1.2em; }
        @media (max-width: 600px) {
            h2 { font-size: 2em; }
            .gallery-img { height: 150px; }
            .navbar a { margin: 0 10px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <nav class="navbar py-3">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold parisienne text-white">Prince & Era</a>
            <div class="space-x-6">
                <a href="/timeline" class="hover:text-pink-300">Our Story</a>
                <a href="/gallery" class="hover:text-pink-300">Memories</a>
                <a href="/letter" class="hover:text-pink-300">Love Letter</a>
                <a href="/confession" class="hover:text-pink-300">Confessions</a>
                <a href="/music" class="hover:text-pink-300">Music</a>
            </div>
        </div>
    </nav>

    <section class="container">
        <h2 class="parisienne">Our Cherished Memories ❤️</h2>
        <div class="gallery-grid">
            {% for img in images %}
            <div class="gallery-item">
                <img src="{{ img.url }}" alt="{{ img.caption }}" class="gallery-img">
                <p class="caption">{{ img.caption }}</p>
            </div>
            {% endfor %}
        </div>
    </section>

    <footer>
        <p class="parisienne">Made with ❤️ for Era by Prince - {{ year }}</p>
    </footer>
</body>
</html>
