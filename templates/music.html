<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music - Prince & Era ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffe4e1, #ff69b4);
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }
        .navbar {
            background: rgba(255, 105, 180, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            box-shadow: 0 2px 10px rgba(255, 105, 180, 0.5);
        }
        .parisienne { font-family: 'Parisienne', cursive; }
        .container { padding-top: 80px; padding-bottom: 20px; }
        h2 {
            font-size: 3em;
            color: #ff1493;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }
        .song-list {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .song-item {
            background: rgba(255, 182, 193, 0.8);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }
        .song-item:hover {
            transform: scale(1.02);
        }
        .song-item a {
            color: #ff1493;
            text-decoration: none;
        }
        .song-item a:hover {
            color: #fff;
            text-decoration: underline;
        }
        .video-container {
            max-width: 800px;
            margin: 20px auto;
        }
        .video-container iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
        }
        footer {
            background: #ff69b4;
            padding: 15px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
        footer p { font-size: 1.2em; }
        @media (max-width: 600px) {
            h2 { font-size: 2em; }
            .song-item { padding: 10px; }
            .video-container { margin: 10px auto; }
        }
    </style>
</head>
<body>
    <nav class="navbar py-3">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold parisienne text-white">Prince & Era</a>
            <div class="space-x-6">
                <a href="/timeline" class="hover:text-pink-300">Our Story</a>
                <a href="/gallery" class="hover:text-pink-300">Memories</a>
                <a href="/letter" class="hover:text-pink-300">Love Letter</a>
                <a href="/confession" class="hover:text-pink-300">Confessions</a>
                <a href="/music" class="hover:text-pink-300">Music</a>
            </div>
        </div>
    </nav>

    <section class="container">
        <h2 class="parisienne">Our Love Songs ❤️</h2>
        <div class="song-list">
            <div class="song-item">
                <p>Audio Only - <a href="https://youtu.be/ztltXpAz1HE?si=QP3IMRrabsWaQ5ZB" target="_blank">Play Audio</a></p>
            </div>
            <div class="song-item">
                <p>Video - <a href="https://youtu.be/mtwdXnTV-8w?si=TvhHA2f_Pgukm2bn" target="_blank">Watch Video</a></p>
            </div>
            <div class="song-item">
                <p>Short Video - <a href="https://youtube.com/shorts/q3Nj9ZMSw4I?si=V2whhA4HlCznWz67" target="_blank">Watch Short</a></p>
            </div>
        </div>
    </section>

    <footer>
        <p class="parisienne">Made with ❤️ for Era by Prince - {{ year }}</p>
    </footer>
</body>
</html>
